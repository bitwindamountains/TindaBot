[project]
name = "tindabot"
version = "0.1.0"
description = "Durable Messenger ordering service for a single seller"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "gspread>=6.2,<7", "google-auth>=2.38,<3",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "respx>=0.22,<1", "pip-audit>=2.8,<3", "pyyaml>=6,<7", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/validation", "/test-results", "/playwright-report"]

[project.scripts]
tindabot = "tindabot.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
